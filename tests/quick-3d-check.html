<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rendering Quick Check</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .test { margin: 10px 0; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>ACE Tennis 3D Rendering Quick Test</h1>
    <div id="results"></div>
    <iframe id="testFrame" src="http://localhost:3002"></iframe>

    <script>
        const results = document.getElementById('results');
        const frame = document.getElementById('testFrame');

        function log(message, status = 'info') {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
        }

        frame.onload = async () => {
            log('Frame loaded, starting tests...');

            // Give React time to render
            await new Promise(r => setTimeout(r, 2000));

            try {
                // Test 1: Check if app loaded
                const frameDoc = frame.contentDocument || frame.contentWindow.document;
                const app = frameDoc.getElementById('root');
                if (app) {
                    log('✓ React app mounted successfully', 'pass');
                } else {
                    log('✗ React app not found', 'fail');
                }

                // Test 2: Find and click 3D demo button
                const buttons = frameDoc.querySelectorAll('button');
                let demoButton = null;

                buttons.forEach(btn => {
                    if (btn.textContent.includes('Explore 3D Demo')) {
                        demoButton = btn;
                    }
                });

                if (demoButton) {
                    log('✓ Found "Explore 3D Demo" button', 'pass');
                    demoButton.click();
                    log('Clicked button, waiting for 3D scene...');

                    // Wait for scene to load
                    await new Promise(r => setTimeout(r, 3000));

                    // Test 3: Check for canvas element
                    const canvas = frameDoc.querySelector('canvas');
                    if (canvas) {
                        log('✓ Canvas element found - 3D rendering is working!', 'pass');
                        log(`Canvas dimensions: ${canvas.width}x${canvas.height}`, 'pass');

                        // Test 4: Check WebGL context
                        const gl = canvas.getContext('webgl') || canvas.getContext('webgl2');
                        if (gl) {
                            log('✓ WebGL context active', 'pass');
                        } else {
                            log('✗ WebGL context not available', 'fail');
                        }
                    } else {
                        log('✗ Canvas element not found - 3D rendering failed', 'fail');
                    }

                    // Test 5: Check for console errors
                    log('Checking for console errors...');
                    // This would need browser extension access, so we'll skip

                } else {
                    log('✗ "Explore 3D Demo" button not found', 'fail');
                }

            } catch (error) {
                log(`✗ Test error: ${error.message}`, 'fail');
            }

            log('Test complete. Check results above.');
        };

        frame.onerror = () => {
            log('✗ Failed to load application. Is the dev server running on port 3002?', 'fail');
        };
    </script>
</body>
</html>
