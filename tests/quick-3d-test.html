<!DOCTYPE html>
<html>
<head>
    <title>Quick 3D Test</title>
    <style>
        body { margin: 0; font-family: monospace; background: #0f172a; color: #fff; padding: 20px; }
        #status { margin-bottom: 20px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        iframe { width: 100%; height: 800px; border: 2px solid #334155; }
    </style>
</head>
<body>
    <div id="status">Loading ACE Tennis 3D view...</div>
    <iframe id="testFrame" src="http://localhost:3001/court"></iframe>

    <script>
        const statusDiv = document.getElementById('status');
        const iframe = document.getElementById('testFrame');

        iframe.onload = () => {
            setTimeout(() => {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const canvas = iframeDoc.querySelector('canvas');
                const errors = [];

                // Check console errors from iframe
                iframe.contentWindow.addEventListener('error', (e) => {
                    errors.push(e.message);
                });

                if (canvas) {
                    const ctx = canvas.getContext('webgl') || canvas.getContext('webgl2');
                    if (ctx) {
                        statusDiv.innerHTML = `
                            <div class="success">✅ Canvas Found!</div>
                            <div class="success">✅ WebGL Context: ${ctx ? 'Working' : 'Failed'}</div>
                            <div>Canvas Size: ${canvas.width}x${canvas.height}</div>
                            <div>3D Rendering: ${canvas.width > 0 && canvas.height > 0 ? 'Active' : 'Inactive'}</div>
                        `;
                    } else {
                        statusDiv.innerHTML = '<div class="error">❌ WebGL context failed to initialize</div>';
                    }
                } else {
                    statusDiv.innerHTML = '<div class="error">❌ Canvas not found in DOM</div>';
                }

                if (errors.length > 0) {
                    statusDiv.innerHTML += `<div class="error">Console Errors: ${errors.join(', ')}</div>`;
                }
            }, 3000);
        };
    </script>
</body>
</html>
