<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071426" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%ace-mark.svg" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ACE is a human-flourishing feedback-loop pretotype: personal and facility digital twins, expert collaboration, sport simulation, and measured intervention-response."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACE | A feedback loop around the human" />
    <meta
      property="og:description"
      content="A physical campus + digital twin ecosystem for goals, evidence, experts, simulation, intervention, and verified learning."
    />
    <meta property="og:site_name" content="ACE" />
    <meta name="twitter:card" content="summary" />
    <title>ACE | A feedback loop around the human</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
<style>
      :root {
        background: #071426;
      }

      html {
        min-height: 100%;
        background: #071426;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        background:
          radial-gradient(circle at 50% -20%, rgba(223, 255, 79, 0.08), transparent 35rem),
          #071426;
        color: white;
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      :focus-visible {
        outline: 2px solid #DFFF4F;
        outline-offset: 3px;
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>ACE needs JavaScript to render this public pretotype.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
