name: Generate and Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'typedoc.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'typedoc.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build documentation
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate TypeDoc documentation
        run: npm run docs:generate

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/api
          retention-days: 1

  # Deploy to GitHub Pages (only on main branch)
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/api

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Validation job for PRs
  validate:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/api

      - name: Validate documentation
        run: |
          echo "📊 Documentation Statistics:"
          echo "Total files: $(find docs/api -type f | wc -l)"
          echo "HTML files: $(find docs/api -name "*.html" | wc -l)"
          echo "Documentation size: $(du -sh docs/api | cut -f1)"

      - name: Check for documentation coverage
        run: |
          if [ $(find docs/api -name "*.html" | wc -l) -lt 5 ]; then
            echo "⚠️ Warning: Low documentation coverage detected"
            exit 0
          else
            echo "✅ Documentation coverage looks good"
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileCount = require('child_process')
              .execSync('find docs/api -name "*.html" | wc -l')
              .toString().trim();
            const size = require('child_process')
              .execSync('du -sh docs/api | cut -f1')
              .toString().trim();

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📚 Documentation Preview\n\n✅ Documentation generated successfully!\n\n**Statistics:**\n- HTML files: ${fileCount}\n- Total size: ${size}\n\nDocumentation will be deployed when this PR is merged.`
            });
