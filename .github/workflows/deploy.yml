name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
      - nightly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: /tmp/ace-pages

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare deploy directory
        run: |
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

      - name: Build main
        run: |
          npm ci
          npm run build
          cp -r dist/. "$DEPLOY_DIR/"
        env:
          VITE_BASE_PATH: '/ace/'

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          clean: true

      - name: Build dev
        run: |
          npm ci
          npm run build
          mkdir -p "$DEPLOY_DIR/dev"
          cp -r dist/. "$DEPLOY_DIR/dev/"
        env:
          VITE_BASE_PATH: '/ace/dev/'

      - name: Checkout nightly
        uses: actions/checkout@v4
        with:
          ref: nightly
          clean: true

      - name: Build nightly
        run: |
          npm ci
          npm run build
          mkdir -p "$DEPLOY_DIR/nightly"
          cp -r dist/. "$DEPLOY_DIR/nightly/"
        env:
          VITE_BASE_PATH: '/ace/nightly/'

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ace-pages

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
