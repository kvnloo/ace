name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
      - nightly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: /tmp/ace-pages

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Prepare deploy directory
        run: |
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

      - name: Build main
        run: |
          npm ci
          npm run build
          cp -r dist/. "$DEPLOY_DIR/"
        env:
          VITE_BASE_PATH: '/ace/'

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          clean: true

      - name: Build dev
        run: |
          npm ci
          npm run build
          mkdir -p "$DEPLOY_DIR/dev"
          cp -r dist/. "$DEPLOY_DIR/dev/"
        env:
          VITE_BASE_PATH: '/ace/dev/'

      - name: Checkout nightly
        uses: actions/checkout@v4
        with:
          ref: nightly
          clean: true

      - name: Build nightly
        run: |
          npm ci
          npm run build
          mkdir -p "$DEPLOY_DIR/nightly"
          cp -r dist/. "$DEPLOY_DIR/nightly/"
        env:
          VITE_BASE_PATH: '/ace/nightly/'

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ace-pages

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  verify-live:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test production, dev, and nightly URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://kvnloo.github.io'
          for channel in '' 'dev/' 'nightly/'; do
            prefix="/ace/${channel}"
            url="${base}${prefix}"
            html="$(mktemp)"
            ready=0
            for attempt in $(seq 1 24); do
              if curl -fsSL --max-time 20 "$url" -o "$html" \
                && grep -q 'id="root"' "$html" \
                && grep -Fq "src=\"${prefix}assets/" "$html"; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::ACE Pages failed HTML/base-path check at $url"
              head -c 500 "$html" || true
              exit 1
            fi
            asset=$(grep -oE "src=\"${prefix}assets/[^\"]+\.js\"" "$html" | head -n 1 | cut -d '"' -f 2)
            if [ -z "$asset" ] || ! curl -fsSL --max-time 20 "${base}${asset}" -o /dev/null; then
              echo "::error::ACE Pages JS asset missing at ${base}${asset}"
              exit 1
            fi
            echo "PASS $url | asset $asset"
          done

      - name: Checkout published source for visual smoke
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js for browser checks
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install browser-smoke dependencies
        run: npm ci

      - name: Test production before any scroll
        run: npm run visual:smoke
        env:
          BASE_URL: https://kvnloo.github.io/ace/
          ARTIFACTS: artifacts/live-visual-smoke

      - name: Upload live browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-live-visual-smoke
          path: artifacts/live-visual-smoke
          if-no-files-found: warn

